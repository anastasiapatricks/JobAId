name: Deploy — Build, Push ECR, Deploy EC2

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.build.outputs.backend_image }}
      frontend_image: ${{ steps.build.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Backend
          docker build -f Dockerfile.backend -t $ECR_REGISTRY/jobaid-backend:$IMAGE_TAG -t $ECR_REGISTRY/jobaid-backend:latest .
          docker push $ECR_REGISTRY/jobaid-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/jobaid-backend:latest
          echo "backend_image=$ECR_REGISTRY/jobaid-backend:$IMAGE_TAG" >> $GITHUB_OUTPUT

          # Frontend
          docker build -f Dockerfile.frontend -t $ECR_REGISTRY/jobaid-frontend:$IMAGE_TAG -t $ECR_REGISTRY/jobaid-frontend:latest .
          docker push $ECR_REGISTRY/jobaid-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/jobaid-frontend:latest
          echo "frontend_image=$ECR_REGISTRY/jobaid-frontend:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR login password
        id: ecr
        run: |
          echo "password=$(aws ecr get-login-password --region $AWS_REGION)" >> $GITHUB_OUTPUT
          echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login to ECR
            echo "${{ steps.ecr.outputs.password }}" | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}

            # Write .env file
            cat > /home/ec2-user/.env << 'ENVEOF'
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
            ADZUNA_APP_ID=${{ secrets.ADZUNA_APP_ID }}
            ADZUNA_API_KEY=${{ secrets.ADZUNA_API_KEY }}
            ENVEOF

            # Set ECR image URIs
            export ECR_BACKEND_URL=${{ steps.ecr.outputs.registry }}/jobaid-backend
            export ECR_FRONTEND_URL=${{ steps.ecr.outputs.registry }}/jobaid-frontend

            cd /home/ec2-user

            # Save current running image IDs for rollback
            OLD_BACKEND=$(docker inspect --format='{{.Image}}' $(docker compose -f docker-compose.prod.yml ps -q backend) 2>/dev/null || echo "")
            OLD_FRONTEND=$(docker inspect --format='{{.Image}}' $(docker compose -f docker-compose.prod.yml ps -q frontend) 2>/dev/null || echo "")

            # Pull latest images and restart
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Wait for health check (retry up to 30 times with 10s intervals)
            for i in $(seq 1 30); do
              if curl -sf http://localhost/api/health; then
                echo "Health check passed!"
                # Clean up old unused Docker images to prevent disk filling up
                docker image prune -af --filter "until=72h"
                exit 0
              fi
              echo "Attempt $i/30: Health check not ready, waiting 10s..."
              sleep 10
            done

            # Health check failed — rollback to previous version
            echo "Health check failed after 5 minutes, rolling back..."
            docker compose -f docker-compose.prod.yml logs --tail=50
            docker compose -f docker-compose.prod.yml down

            if [ -n "$OLD_BACKEND" ] && [ -n "$OLD_FRONTEND" ]; then
              docker tag "$OLD_BACKEND" ${ECR_BACKEND_URL}:latest
              docker tag "$OLD_FRONTEND" ${ECR_FRONTEND_URL}:latest
              docker compose -f docker-compose.prod.yml up -d
              echo "Rollback complete — restored previous version"
            else
              echo "No previous images to rollback to"
            fi
            exit 1

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='JobAId CDN'].Id" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
