[project]
name = "jobaid"
version = "0.2.0"
description = "JobAId — LLM-powered multi-agent job search assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "grandalf>=0.8",
    "httpx>=0.28.1",
    "langchain>=0.3.30",
    "langchain-openai>=0.2.14",
    "langgraph>=1.0.10",
    "lxml>=6.0.1",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.1.1",
    "tavily-python>=0.5.0",
    "python-multipart>=0.0.18",
    "pytz>=2025.2",
    "uvicorn>=0.34.0",
    "pypdf>=6.9.2",
    "python-docx>=1.1",
    "spacy>=3.8.11",
    "pip>=26.0.1",
    "en-core-web-sm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pip-audit>=2.7",
    "httpx>=0.28",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz" }
